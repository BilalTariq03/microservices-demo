# ─────────────────────────────────────────────────────────────
# redis/deployment.yml
# ─────────────────────────────────────────────────────────────
# Redis is a fast in-memory database used by the cart service
# to store shopping cart data.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine         # official Redis image — no custom Dockerfile needed
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "70m"
              memory: "200Mi"
            limits:
              cpu: "125m"
              memory: "256Mi"
