# ─────────────────────────────────────────────────────────────
# frontend/deployment.yml
# ─────────────────────────────────────────────────────────────
# A Deployment tells Kubernetes:
#   - WHAT image to run
#   - HOW MANY copies (replicas)
#   - WHAT environment variables to pass in

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: boutique
spec:
  replicas: 1                   # run 1 copy of this container
  selector:
    matchLabels:
      app: frontend             # links this Deployment to its Pods
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 22i1297/frontend:8f65b0e
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice:9555"
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "shoppingassistantservice:8080"
            - name: ENV_PLATFORM
              value: "aws"
          resources:
            requests:
              cpu: "100m"       # minimum CPU (100 millicores = 0.1 CPU)
              memory: "64Mi"    # minimum RAM
            limits:
              cpu: "200m"       # maximum CPU
              memory: "128Mi"   # maximum RAM
