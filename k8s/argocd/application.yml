# ─────────────────────────────────────────────────────────────
# k8s/argocd/application.yml
# ─────────────────────────────────────────────────────────────
# This tells ArgoCD:
#   - WHERE to find the k8s manifests (your GitHub repo)
#   - WHERE to deploy them (your Kubernetes cluster)
#   - HOW OFTEN to check for changes (every 3 minutes)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique                      # name of this ArgoCD app
  namespace: argocd                   # ArgoCD lives in its own namespace
spec:
  project: default

  # WHERE is the source code / manifests?
  source:
    repoURL: https://github.com/22i1297/microservices-demo  # ← update this
    targetRevision: HEAD              # always use the latest commit
    path: k8s                         # look in the k8s/ folder

  # WHERE should it deploy to?
  destination:
    server: https://kubernetes.default.svc   # the local cluster
    namespace: boutique                       # our app's namespace

  # HOW should it sync?
  syncPolicy:
    automated:
      prune: true       # delete resources removed from manifests
      selfHeal: true    # auto-fix if someone manually changes k8s
    syncOptions:
      - CreateNamespace=true    # create the namespace if it doesn't exist
